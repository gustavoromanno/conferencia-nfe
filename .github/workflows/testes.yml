name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - name: Navegador para o teste de paridade do painel
        run: python -m playwright install --with-deps chromium
      - name: Exemplos do painel estão atualizados
        run: |
          python painel/gerar_exemplos.py
          git diff --exit-code painel/exemplos.js modelos/
      - name: Testes unitários e de ponta a ponta
        run: python -m pytest -q
      - name: Avaliação no conjunto básico (regras)
        run: |
          python gerar_dados.py dados_basico 7
          python conferir.py --dados dados_basico --saida saida_basico
          python avaliar.py --dados dados_basico --saida saida_basico
      - name: Avaliação no conjunto realista (regras)
        run: |
          python gerar_dados.py dados_realista 7 --realista
          python conferir.py --dados dados_realista --saida saida_realista
          python avaliar.py --dados dados_realista --saida saida_realista
